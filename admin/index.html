<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Login | Caju Alerta</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="login-body">
  <div class="login-box">
    <div class="login-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      Admin Caju
    </div>
    <form id="adminLoginForm">
      <div class="input-group">
        <label>Usuário</label>
        <input type="text" required>
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" required>
      </div>
      <button type="submit" class="btn">Entrar no Sistema</button>
    </form>
    <div style="margin-top: 20px;">
      <a href="../index.html" style="color: #94a3b8; font-size: 0.85rem; text-decoration: none;">Voltar ao site</a>
    </div>
  </div>
  
  <script src="../assets/js/admin.js"></script>
</body>
</html>
