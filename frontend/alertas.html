<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Alertas | Caju Alerta</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <style>
    .news-page { max-width: 920px; margin: 0 auto; padding: 150px 24px 100px; }
    .news-intro { max-width: 620px; margin-bottom: 48px; }
    .news-intro p, .news-empty p { color: var(--text-muted); }
    .news-empty { border: 1px solid var(--surface-border); border-radius: var(--radius-lg); padding: 64px 24px; text-align: center; background: var(--surface-color); }
    .news-empty h2 { margin-bottom: 12px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo"><img src="/assets/img/logo2.png" alt="Caju Alerta" class="site-logo"></a>
      <button class="menu-toggle" id="mobileMenuBtn" aria-label="Abrir menu"><span></span><span></span><span></span></button>
      <nav class="main-nav" id="mainNav"><ul class="nav-list">
        <li><a href="/" class="nav-link">Início</a></li><li><a href="/noticias" class="nav-link active">Portal de Notícias</a></li>
      </ul></nav>
    </div>
  </header>
  <main class="news-page">
    <div class="news-intro">
      <h1>Portal de Notícias</h1>
      <p>Entenda como os golpes estão acontecendo, quais estratégias os criminosos usam e como se proteger.</p>
    </div>
    <section class="news-empty" aria-live="polite">
      <h2>Nenhuma notícia publicada ainda</h2>
      <p>Quando houver uma atualização de segurança, ela aparecerá aqui.</p>
    </section>
  </main>
  <script src="assets/js/common.js"></script>
</body>
</html>
