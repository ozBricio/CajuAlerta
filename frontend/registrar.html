<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Denúncia - Caju Alerta</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/registrar.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
</head>
<body>
  <header class="main-header">
    <div class="header-container">
      <a href="index.html" class="logo"><img src="assets/img/logo2.png" alt="Caju Alerta" class="site-logo"></a>
      <nav id="mainNav">
        <ul>
          <li><a href="index.html" class="nav-link">Início</a></li>
          <li class="platform-entry"><a href="login.html" class="platform-link" id="platformAccessLink">Acessar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="registrar-container">
    <div class="registrar-box">
      <h1>Registrar Ocorrência</h1>
      <p class="subtitle">Forneça os dados do golpe. Essas informações poderão ser usadas em processos judiciais.</p>

      <form id="formDenuncia" novalidate>
        <div class="form-group">
          <label for="tipoDenuncia">O que você deseja denunciar?</label>
          <select id="tipoDenuncia" class="form-input" required>
            <option value="" disabled selected>Selecione o tipo...</option>
            <option value="telefone">Número de Telefone / WhatsApp</option>
            <option value="email">Endereço de E-mail</option>
            <option value="site">Site / Link Falso</option>
          </select>
        </div>

        <div class="form-group d-none" id="groupAlvo">
          <label id="labelAlvo" for="inputAlvo">Alvo</label>
          <input type="text" id="inputAlvo" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="inputMotivo">Motivo da Denúncia (Mínimo de 5 palavras)</label>
          <textarea id="inputMotivo" class="form-input" rows="4" placeholder="Descreva detalhadamente o que aconteceu..." required></textarea>
          <div class="field-error-msg d-none" id="err-motivo">⚠️ A descrição deve ter pelo menos 5 palavras.</div>
        </div>

        <fieldset class="terms-group">
          <legend>Termos Legais e Localização</legend>
          <label class="checkbox-label" style="margin-bottom: 15px;">
            <input type="checkbox" id="aceiteLegal" required>
            <span>Declaro que os dados fornecidos são verdadeiros e concordo que minha <strong>Localização Geográfica (GPS)</strong> seja registrada junto à denúncia. <br><small>Esses dados são sigilosos e só serão repassados à Polícia ou à Justiça mediante mandado, conforme a lei.</small></span>
          </label>
        </fieldset>

        <button type="submit" id="btnSubmitDenuncia" class="btn btn-primary btn-block" style="margin-top: 20px;">Registrar Denúncia Oficial</button>
        <div id="errorBox" class="alert-box error d-none" style="margin-top: 15px;"></div>
        <div id="successBox" class="alert-box success d-none" style="margin-top: 15px;">
          ✅ Denúncia registrada com sucesso! Ela já consta em nossos sistemas de inteligência.
        </div>
      </form>
    </div>
  </main>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/registrar.js"></script>
</body>
</html>
