<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/assets/img/logo2.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada | Caju Alerta</title>
  <link rel="stylesheet" href="/assets/css/common.css">
  <style>
    .not-found { min-height: 70vh; display: grid; place-items: center; padding: 140px 24px 80px; text-align: center; }
    .not-found-content { max-width: 560px; }
    .not-found-code { color: var(--primary-orange); font-size: 5rem; line-height: 1; margin-bottom: 20px; }
    .not-found h1 { margin-bottom: 14px; }
    .not-found p { color: var(--text-muted); margin-bottom: 28px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo"><img src="/assets/img/logo2.png" alt="Caju Alerta" class="site-logo"></a>
      <nav class="main-nav"><ul class="nav-list">
        <li><a href="/" class="nav-link">Início</a></li>
        <li><a href="/noticias" class="nav-link">Portal de Notícias</a></li>
      </ul></nav>
    </div>
  </header>
  <main class="not-found">
    <div class="not-found-content">
      <div class="not-found-code">404</div>
      <h1>Página não encontrada</h1>
      <p>O endereço não existe ou foi digitado incorretamente.</p>
      <a class="btn-primary" href="/">Voltar ao início</a>
    </div>
  </main>
</body>
</html>
